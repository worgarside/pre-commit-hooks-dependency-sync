---
name: Semantic Release

on:
  push:
    branches:
      - main
    paths:
      - 'pre_commit_hooks_dependency_sync/**'
      - '!pre_commit_hooks_dependency_sync/__init__.py'

  workflow_dispatch:
    inputs:
      force-deployment:
        description: >-
          Version component to force, or auto to use semantic commit parsing.
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: worgarside/github-config-files/.github/workflows/__semantic-release.yml@0.5.1
    with:
      python-version: '3.13'
      force-deployment: '${{ inputs.force-deployment != 'auto' && inputs.force-deployment || '' }}'
    secrets: inherit
